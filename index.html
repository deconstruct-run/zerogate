  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:clamp(28px,5vw,56px);line-height:1.02;font-weight:700;letter-spacing:-0.02em;text-wrap:balance\">FLOATING POINTS // Parallax : System 002<\u002Fh1>\n  <div style=\"font-size:clamp(16px,2vw,22px)\">Element Reference &amp; Composition Guide<\u002Fdiv>\n<\u002Fheader>\n\n<div data-fp-topbar=\"1\" style=\"position:sticky;top:0;z-index:10;background:#EFEAE0;border-bottom:2px solid #111\">\n  <div style=\"max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">\n    <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ toggleSources }}\" style=\"font:inherit;padding:7px 10px;min-height:40px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\">{{ sourcesLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showUploads }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n      <sc-if value=\"{{ thumbA }}\" hint-placeholder-val=\"{{ false }}\"><div title=\"Source A\" style=\"width:30px;height:30px;border:1px solid #111;background-color:#000;background-size:cover;background-image:{{ thumbACss }}\"><\u002Fdiv><\u002Fsc-if>\n      <label style=\"padding:7px 10px;min-height:40px;display:inline-flex;align-items:center;border:1px solid #111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">Source A<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upA }}\" style=\"display:none\"><\u002Flabel>\n      <sc-if value=\"{{ thumbB }}\" hint-placeholder-val=\"{{ false }}\"><div title=\"Source B\" style=\"width:30px;height:30px;border:1px solid #111;background-color:#000;background-size:cover;background-image:{{ thumbBCss }}\"><\u002Fdiv><\u002Fsc-if>\n      <label style=\"padding:7px 10px;min-height:40px;display:inline-flex;align-items:center;border:1px solid #111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">Source B<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upB }}\" style=\"display:none\"><\u002Flabel>\n      <label style=\"padding:7px 10px;min-height:40px;display:inline-flex;align-items:center;border:1px solid #111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">Depth A<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upDA }}\" style=\"display:none\"><\u002Flabel>\n      <label style=\"padding:7px 10px;min-height:40px;display:inline-flex;align-items:center;border:1px solid #111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">Depth B<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ upDB }}\" style=\"display:none\"><\u002Flabel>\n      <button sc-camel-on-click=\"{{ resetSources }}\" style=\"font:inherit;padding:7px 10px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">Reset sources<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n      <sc-raw-select value=\"{{ count }}\" sc-camel-on-change=\"{{ setCount }}\" style=\"font:inherit;padding:6px 8px;border:1px solid #111;background:#EFEAE0;color:#111\">\n        <sc-for list=\"{{ countOptions }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{ togglePause }}\" style=\"font:inherit;padding:7px 10px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;min-width:88px\" style-hover=\"background:#111;color:#EFEAE0\">{{ pauseLabel }}<\u002Fbutton>\n      <input type=\"search\" placeholder=\"Search code, name, constant\" value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" style=\"font:inherit;font-size:16px;padding:7px 10px;min-height:40px;border:1px solid #111;background:#fff;color:#111;min-width:0;width:220px;max-width:100%\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-left:auto;flex:none;align-items:center\">\n    <div style=\"display:flex;border:1px solid #111;flex:none\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"3\">\n        <sc-if value=\"{{ tb.active }}\"><button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"font:inherit;padding:7px 10px;min-height:40px;border:0;background:#D9D445;color:#111;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;flex:1 0 auto\">{{ tb.label }}<\u002Fbutton><\u002Fsc-if>\n        <sc-if value=\"{{ tb.inactive }}\"><button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"font:inherit;padding:7px 10px;min-height:40px;border:0;background:transparent;color:#111;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;flex:1 0 auto\" style-hover=\"background:#111;color:#EFEAE0\">{{ tb.label }}<\u002Fbutton><\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ notice }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:0 16px 10px;display:flex;gap:10px;align-items:center;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">\n      <span style=\"background:#111;color:#EFEAE0;padding:3px 7px\">NOTICE<\u002Fspan><span style=\"flex:1;min-width:0\">{{ notice }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ clearNotice }}\" style=\"font:inherit;border:1px solid #111;background:transparent;padding:3px 8px;cursor:pointer\">×<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ flash }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;right:16px;bottom:16px;z-index:300;background:#111;color:#EFEAE0;padding:10px 14px;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">{{ flash }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ glError }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1440px;margin:24px auto;padding:0 16px\">\n    <div style=\"border:3px solid #111;padding:24px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-weight:700\">WEBGL2 UNAVAILABLE<\u002Fdiv>\n      <div>{{ glError }}<\u002Fdiv>\n      <div>This sheet needs a browser with WebGL2 and float render targets (current Chrome, Edge, Firefox or Safari 15+). The reference text remains readable in Index view.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<main style=\"max-width:1440px;margin:0 auto;padding:0 16px 40px\">\n<sc-if value=\"{{ showGuide }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"margin-top:24px;border:2px solid #111;background:#EFEAE0\">\n  <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid #111;background:#111;color:#EFEAE0\">\n    <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:0.1em\">HOW TO USE THIS SHEET<\u002Fspan>\n    <button sc-camel-on-click=\"{{ hideGuide }}\" style=\"margin-left:auto;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;padding:4px 8px;border:1px solid #EFEAE0;background:transparent;color:#EFEAE0;cursor:pointer;letter-spacing:0.06em;white-space:nowrap\" style-hover=\"background:#EFEAE0;color:#111\">HIDE ×<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))\">\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 6px\">01<\u002Fspan><span style=\"font-weight:700;font-size:14px;letter-spacing:0.04em\">WATCH<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Every tile runs one element on the same 10-second loop: hold image A, dissipate, drift, reform into image B, hold. The thin line under each tile shows where the loop is.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 6px\">02<\u002Fspan><span style=\"font-weight:700;font-size:14px;letter-spacing:0.04em\">OPEN<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Click any tile to expand it. You get the full reference text, a scrubber, and an on/off toggle to compare the element against the baseline. Arrow keys step between elements; Esc closes.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 6px\">03<\u002Fspan><span style=\"font-weight:700;font-size:14px;letter-spacing:0.04em\">TUNE &amp; COPY<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Move the sliders in the expanded view. <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">Copy prompt block<\u002Fspan> gives the reference text; <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">Copy tuned block<\u002Fspan> adds your current values. Tuning is saved in this browser.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 6px\">04<\u002Fspan><span style=\"font-weight:700;font-size:14px;letter-spacing:0.04em\">COMPOSE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Open <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">Composer<\u002Fspan> to stack elements or load a preset. It adds prerequisites, flags conflicts, and builds one combined prompt. Save a stack to add it to Preset Combinations.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 6px\">05<\u002Fspan><span style=\"font-weight:700;font-size:14px;letter-spacing:0.04em\">LISTEN<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Open <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">AUDITORI<\u002Fspan> and load a song. It maps the beats, then the field kicks, flashes and reforms on the downbeats. Press Sound to hear it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 7px\">06<\u002Fspan><span style=\"font-size:13px;font-weight:700;letter-spacing:0.04em\">VOLUME<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">Open <a href=\"{{ volLink }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">003 VOLUME<\u002Fa> to turn a video into a stack of particle planes (Family G). Any stack you build in Composer opens there with OPEN STACK IN VOLUME.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:10px 14px;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;line-height:1.5;display:flex;flex-wrap:wrap;gap:6px 18px\">\n    <span><b>SOURCE A / B<\u002Fb> replace the two images<\u002Fspan>\n    <span><b>DEPTH A / B<\u002Fb> add depth maps (else luminance)<\u002Fspan>\n    <span><b>SEARCH<\u002Fb> filters by code, name or constant<\u002Fspan>\n    <span><b>INDEX<\u002Fb> lists all 34 elements<\u002Fspan>\n    <span><b>AUDITORI<\u002Fb> drives the field from a song<\u002Fspan>\n    <span><b>SETTINGS<\u002Fb> (footer) export / import / reset<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));border-top:1px solid #111\">\n    <div style=\"padding:12px 14px;border-right:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:0.06em\">SOURCE A / B · ANY IMAGE<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;text-wrap:pretty\">JPG, PNG, WebP or GIF. The image is cropped to its centre square and reduced to 256 px, so square images over about 512 px work best. Particles follow brightness: pure black gets none. A bright subject on a dark background forms the cleanest shape; strong contrast reads better than flat light.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:12px 14px;border-right:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:0.06em\">DEPTH A / B · OPTIONAL<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;text-wrap:pretty\">Grayscale: white is near, black is far. Crop it the same way as its source so they line up; only brightness is read. Without one, depth is guessed from the source's brightness. Depth shows with C1–C4, D1, D3 and presets like Ether and Breath. Uploads last for the current visit.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ isSheet }}\" hint-placeholder-val=\"{{ true }}\">\n  <sc-for list=\"{{ families }}\" as=\"fam\" hint-placeholder-count=\"5\">\n    <sc-if value=\"{{ fam.show }}\">\n      <section style=\"padding-top:36px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;border-top:3px solid #111;padding-top:12px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap\">\n            <span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-weight:700;padding:3px 8px;font-size:14px\">{{ fam.id }}<\u002Fspan>\n            <h2 style=\"margin:0;font-size:22px;letter-spacing:0.02em\">{{ fam.heading }}<\u002Fh2>\n            <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px\">{{ fam.governs }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;max-width:760px;text-wrap:pretty\">{{ fam.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px\">\n          <sc-for list=\"{{ fam.tiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;border:1px solid #111;background:#EFEAE0;min-width:0\">\n              <div data-tile=\"{{ t.key }}\" sc-camel-on-click=\"{{ t.open }}\" style=\"position:relative;aspect-ratio:1 / 1;background:#000;cursor:pointer\">\n                <canvas data-tile-cv=\"1\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none\"><\u002Fcanvas>\n                <sc-if value=\"{{ t.err }}\"><div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:13px\">{{ t.errText }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:5px;background:#3a3a3a;overflow:hidden;border-top:1px solid #fff;border-bottom:1px solid #fff;box-sizing:content-box\">\n                <div data-prog=\"{{ t.key }}\" style=\"position:absolute;left:0;top:0;bottom:0;width:100%;background:#111;transform-origin:0 50%\"><\u002Fdiv>\n                <div style=\"position:absolute;left:30%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n                <div style=\"position:absolute;left:60%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n                <div style=\"position:absolute;left:85%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ t.open }}\" style=\"padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer\">\n                <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n                  <span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-weight:700;padding:2px 6px;font-size:12px\">{{ t.code }}<\u002Fspan>\n                  <span style=\"font-weight:700;font-size:13px;letter-spacing:0.03em\">{{ t.name }}<\u002Fspan>\n                  <sc-for list=\"{{ t.tags }}\" as=\"tg\"><span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;border:1px solid #111;padding:1px 5px\">+ {{ tg }}<\u002Fspan><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.35;text-wrap:pretty\">{{ t.effect }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fsc-for>\n\n  <sc-if value=\"{{ showPresets }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"padding-top:36px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;border-top:3px solid #111;padding-top:12px\">\n        <div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap\">\n          <span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-weight:700;padding:3px 8px;font-size:14px\">P<\u002Fspan>\n          <h2 style=\"margin:0;font-size:22px;letter-spacing:0.02em\">PRESET COMBINATIONS<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;max-width:760px\">Each tile runs its full stack. Saved Composer stacks follow the ten built-in presets.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px\">\n        <sc-for list=\"{{ presetTiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;border:1px solid #111;background:#EFEAE0;min-width:0\">\n            <div data-tile=\"{{ t.key }}\" sc-camel-on-click=\"{{ t.open }}\" style=\"position:relative;aspect-ratio:1 / 1;background:#000;cursor:pointer\">\n                <canvas data-tile-cv=\"1\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none\"><\u002Fcanvas>\n              <sc-if value=\"{{ t.err }}\"><div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:13px\">{{ t.errText }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:5px;background:#3a3a3a;overflow:hidden;border-top:1px solid #fff;border-bottom:1px solid #fff;box-sizing:content-box\">\n              <div data-prog=\"{{ t.key }}\" style=\"position:absolute;left:0;top:0;bottom:0;width:100%;background:#111;transform-origin:0 50%\"><\u002Fdiv>\n              <div style=\"position:absolute;left:30%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n              <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n              <div style=\"position:absolute;left:60%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n              <div style=\"position:absolute;left:85%;top:0;bottom:0;width:1px;background:#EFEAE0\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ t.open }}\" style=\"padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer\">\n              <div style=\"font-weight:700;font-size:15px\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.35\">{{ t.character }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:4px\">\n                <sc-for list=\"{{ t.chips }}\" as=\"c\"><span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;background:#111;color:#EFEAE0;padding:1px 5px\">{{ c }}<\u0 Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;padding-top:6px\">\n            <button sc-camel-on-click=\"{{ ex.reset }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:8px 12px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;text-transform:uppercase\" style-hover=\"background:#111;color:#EFEAE0\">Reset to defaults<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ ex.isEl }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #111;padding-top:10px\">\n            <div style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;font-weight:700;letter-spacing:0.08em\">PROMPT BLOCK<\u002Fdiv>\n            <pre style=\"margin:0;background:#111;color:#EFEAE0;padding:14px;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere\">{{ ex.prompt }}<\u002Fpre>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ ex.copyBlock }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:8px 12px;border:1px solid #111;background:#C4EDEE;color:#111;cursor:pointer;text-transform:uppercase\" style-hover=\"background:#111;color:#EFEAE0\">Copy prompt block<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ ex.copyTuned }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:8px 12px;border:1px solid #111;background:#ED7F1C;color:#111;font-weight:700;cursor:pointer;text-transform:uppercase\">Copy tuned block<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ex.isPreset }}\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;border-top:2px solid #111;padding-top:10px\">\n            <button sc-camel-on-click=\"{{ ex.copyCombined }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:8px 12px;border:1px solid #111;background:#ED7F1C;color:#111;font-weight:700;cursor:pointer;text-transform:uppercase\">Copy combined prompt<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ ex.loadComposer }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:8px 12px;border:1px solid #111;background:#C4EDEE;color:#111;cursor:pointer;text-transform:uppercase\" style-hover=\"background:#111;color:#EFEAE0\">Open in Composer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ ex.bottomFields }}\" as=\"f\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;font-weight:700;letter-spacing:0.08em\">{{ f.label }}<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.45;text-wrap:pretty\"><sc-for list=\"{{ f.segs }}\" as=\"s\"><sc-if value=\"{{ s.link }}\"><a sc-camel-on-click=\"{{ s.open }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:0.9em;background:#111;color:#EFEAE0;padding:0 4px;text-decoration:none;cursor:pointer\">{{ s.t }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ s.mono }}\"><code style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:0.88em;border-bottom:1px solid #111\">{{ s.t }}<\u002Fcode><\u002Fsc-if><sc-if value=\"{{ s.plain }}\"><span>{{ s.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ ex.isG }}\">\n          <a href=\"{{ ex.volHref }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:10px 14px;border:2px solid #111;background:#ED7F1C;color:#111;font-weight:700;text-decoration:none;text-transform:uppercase;align-self:flex-start\">OPEN IN VOLUME ↗<\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ex.isF1 }}\">\n          <button sc-camel-on-click=\"{{ ex.openAuditori }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:10px 14px;border:2px solid #111;background:#ED7F1C;color:#111;font-weight:700;cursor:pointer;text-transform:uppercase;align-self:flex-start\">Open AUDITORI : System 001<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ex.isEl }}\">\n          <button sc-camel-on-click=\"{{ ex.addToComposer }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:10px 14px;border:2px solid #111;background:transparent;color:#111;cursor:pointer;text-transform:uppercase;align-self:flex-start\" style-hover=\"background:#111;color:#EFEAE0\">Add to Composer<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ready:false, view:'sheet', search:'', expanded:null, tuned:{}, saved:[],\n    narrow: typeof window !== 'undefined' && window.innerWidth < 720, srcOpen:false,\n    count: (typeof window !== 'undefined' && (window.innerWidth < 720 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches))) ? 64 : 128,\n    auStack:'P:Ether', auOpen:false, auPlaying:false, auArmed:false, auStatus:'No song loaded. The field runs on a synthetic 120 BPM grid until you load one.', auMapVer:0, auBusy:false, paused:false, notice:'', flash:'', errors:{}, glError:'',\n    comp:{ stack:['A1','B1'], params:{}, notes:[] }, compCount:256, compName:'', exOn:true, exPlaying:true, exFreeze:false, focusErr:'',\n    settingsOpen:false, guideHidden: (() => { try { return localStorage.getItem('fp002.guide') === '0'; } catch(e){ return false; } })(), beatsText:'', pulseSource:'synthetic 120 BPM', srcVer:0, maskName:'' };\n\n  componentDidMount(){\n    this._hash = () => { const hh = location.hash; if(hh === '#auditori'){ if(!this.state.auOpen) this.openAuditori(); } else if(this.state.auOpen) this.closeAuditori(); };\n    window.addEventListener('hashchange', this._hash); if(location.hash === '#auditori') setTimeout(() => this.openAuditori(), 0);\n    this._key = e => this.onKey(e); window.addEventListener('keydown', this._key);\n    this._rz = () => { const n = window.innerWidth < 720; if(n !== this.state.narrow) this.setState({ narrow:n }); }; window.addEventListener('resize', this._rz);\n    this._vis = () => { if(document.hidden && this.state.auPlaying) this.auTogglePlay(); }; document.addEventListener('visibilitychange', this._vis);\n    this._auP = {};\n    this.au = { map:null, audio:null, url:null, buffer:null, t:0, base:0, name:'track', source:'synthetic grid' };\n    this._fg = () => this.setState(s => ({ srcVer: (s.srcVer || 0) + 1 })); window.addEventListener('fp-data-g', this._fg);\n    const boot = () => {\n      if(!window.FPEngine || !window.FP_DATA || (!window.FP_DATA.elements.some(e => e.code === 'G1') && (this._gw = (this._gw || 0) + 1) < 200)){ this._bt = setTimeout(boot, 30); return; }\n      window.FPEngine.Sources.init();\n      this._srcUnsub = window.FPEngine.Sources.on(() => this.setState(s => ({ srcVer: s.srcVer + 1 })));\n      this.setState(Object.assign({ ready:true }, this.load()), () => {\n        try {\n          this.sheet = new window.FPEngine.Sheet(null, {\n            res: this.state.count, maxDpr: this.state.narrow ? 1.5 : 2,\n            clipTop: () => { const b = document.querySelector('[data-fp-topbar]'); return b ? b.getBoundingClientRect().bottom : 0; },\n            onError: (k, c) => this.setState(s => ({ errors: Object.assign({}, s.errors, { [k]: c }) })),\n            onRes: (r) => this.setState({ count: r, notice: 'Frame rate fell below 30 fps for two seconds. Tile count stepped down to ' + this.countLabel(r) + '.' })\n          });\n          this.afterUpdate();\n        } catch (e) { console.error(e); this.setState({ glError: (e && e.message) || String(e) }); }\n      });\n    };\n    boot();\n  }\n  componentWillUnmount(){\n    clearTimeout(this._bt); window.removeEventListener('keydown', this._key); window.removeEventListener('resize', this._rz); document.removeEventListener('visibilitychange', this._vis);\n    if(this._srcUnsub) this._srcUnsub();\n    [this.sheet, this.focus, this.compF, this.auF].forEach(x => { if(x) x.destroy(); });\n    if(this.au && this.au.audio){ this.au.audio.pause(); URL.revokeObjectURL(this.au.url); }\n  }\n  componentDidUpdate(){ this.afterUpdate(); }\n\n  /* ---------- persistence ---------- */\n  load(){\n    try { const raw = localStorage.getItem('fp002.v1'); if(!raw) return {}; const o = JSON.parse(raw);\n      return { tuned: o.tuned || {}, saved: o.saved || [], view: (o.view && o.view !== 'auditori') ? o.view : 'sheet', auStack: o.auStack || 'P:Ether', comp: o.comp && o.comp.stack ? Object.assign({ notes:[] }, o.comp, { notes:[] }) : this.state.comp };\n    } catch(e){ return {}; }\n  }\n  persist(){\n    const s = this.state; const str = JSON.stringify({ tuned:s.tuned, saved:s.saved, view:s.view, auStack:s.auStack, comp:{ stack:s.comp.stack, params:s.comp.params } });\n    if(str === this._saved) return; this._saved = str;\n    try { localStorage.setItem('fp002.v1', str); } catch(e){}\n  }\n\n  /* ---------- engine wiring ---------- */\n  afterUpdate(){\n    const s = this.state, E = window.FPEngine; if(!s.ready || s.glError || !E) return;\n    this.persist();\n    if(this.sheet){\n      this.sheet.setActive(s.view === 'sheet' && !s.expanded && !s.auOpen);\n      this.sheet.setPaused(s.paused);\n      if(this.sheet.res !== s.count) this.sheet.setRes(s.count);\n      if(s.view === 'sheet') this.sheet.sync(this.sheetConfigs());\n    }\n    if(s.expanded){\n      const c = document.getElementById('fp-focus-canvas');\n      if(c && (!this.focus || this.focus.canvas !== c)){\n        if(
