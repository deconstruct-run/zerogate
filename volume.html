document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dCommit }}\" aria-label=\"Project seed\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;padding:4px 6px;border:0;background:#fff;color:#111;width:92px\">\n      <button sc-camel-on-click=\"{{ reroll }}\" title=\"Reroll seed (logged)\" style=\"font:inherit;padding:4px 8px;border:0;border-left:1px solid #111;background:transparent;color:#111;cursor:pointer\" style-hover=\"background:#111;color:#EFEAE0\">↻<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-menu=\"1\" style=\"position:relative\">\n      <button sc-camel-on-click=\"{{ toggleFile }}\" style=\"font:inherit;font-size:11px;padding:5px 10px;border:1px solid #111;background:#111;color:#EFEAE0;cursor:pointer;letter-spacing:0.06em\">FILE ▾<\u002Fbutton>\n      <sc-if value=\"{{ fileOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:100%;left:0;z-index:40;background:#EFEAE0;border:2px solid #111;min-width:240px;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ fileItems }}\" as=\"it\">\n            <button sc-camel-on-click=\"{{ it.run }}\" disabled=\"{{ it.dis }}\" style=\"font:inherit;text-align:left;display:flex;gap:8px;align-items:center;padding:7px 10px;border:0;border-bottom:1px solid #cfc8b9;background:transparent;color:#111;cursor:pointer;opacity:{{ it.op }}\" style-hover=\"background:#111;color:#EFEAE0\">\n              <span style=\"flex:1\">{{ it.label }}<\u002Fspan><span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px\">{{ it.tag }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;border:1px solid #111\">\n      <button sc-camel-on-click=\"{{ undo }}\" disabled=\"{{ noUndo }}\" title=\"Undo (Ctrl/Cmd-Z)\" style=\"font:inherit;font-size:11px;padding:5px 8px;border:0;background:transparent;color:#111;cursor:pointer;opacity:{{ undoOp }}\" style-hover=\"background:#111;color:#EFEAE0\">UNDO<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ redo }}\" disabled=\"{{ noRedo }}\" title=\"Redo (Shift-Ctrl/Cmd-Z)\" style=\"font:inherit;font-size:11px;padding:5px 8px;border:0;border-left:1px solid #111;background:transparent;color:#111;cursor:pointer;opacity:{{ redoOp }}\" style-hover=\"background:#111;color:#EFEAE0\">REDO<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ openHistory }}\" style=\"font:inherit;font-size:11px;padding:5px 8px;border:0;border-left:1px solid #111;background:#C4EDEE;color:#111;cursor:pointer\" style-hover=\"background:#111;color:#EFEAE0\">HISTORY {{ eventCount }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;gap:8px;align-items:center\">\n      <div style=\"display:flex;border:1px solid #111;font-size:11px;letter-spacing:0.06em\">\n        <span style=\"padding:5px 9px;background:#111;color:#EFEAE0\">STUDIO<\u002Fspan>\n        <button sc-camel-on-click=\"{{ openComponent }}\" style=\"font:inherit;padding:5px 9px;border:0;border-left:1px solid #111;background:transparent;color:#111;cursor:pointer\" style-hover=\"background:#111;color:#EFEAE0\">COMPONENT ↗<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ openLive }}\" style=\"font:inherit;padding:5px 9px;border:0;border-left:1px solid #111;background:transparent;color:#111;cursor:pointer\" style-hover=\"background:#111;color:#EFEAE0\">LIVE ↗<\u002Fbutton>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleGuide }}\" style=\"font:inherit;font-size:11px;padding:5px 10px;border:1px solid #111;background:#C4EDEE;color:#111;cursor:pointer;letter-spacing:0.06em\" style-hover=\"background:#111;color:#EFEAE0\">GUIDE<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- INSTRUCTIONS -->\n  <div style=\"border-bottom:1px solid #111;min-width:0\">\n    <sc-if value=\"{{ introOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr)) auto;align-items:stretch\">\n        <div style=\"padding:0 12px;border-right:1px solid #111;display:flex;align-items:center;background:#111;color:#EFEAE0;font-size:12px;font-weight:700;white-space:nowrap\">Start here<\u002Fdiv>\n        <sc-for list=\"{{ introSteps }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <div title=\"{{ st.body }}\" style=\"height:34px;padding:0 10px;border-right:1px solid #111;display:flex;gap:8px;align-items:center;min-width:0;background:{{ st.bg }}\">\n            <span style=\"flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;font-weight:700;background:{{ st.badgeBg }};color:{{ st.badgeFg }};border:1px solid #111\">{{ st.mark }}<\u002Fspan>\n            <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px\"><b>{{ st.title }}<\u002Fb> · {{ st.short }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;align-items:center;gap:4px;padding:0 8px\">\n          <button sc-camel-on-click=\"{{ toggleGuide }}\" style=\"font:inherit;font-size:11px;padding:5px 10px;border:1px solid #111;background:#C4EDEE;color:#111;cursor:pointer;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">FULL GUIDE<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ hideIntro }}\" style=\"font:inherit;font-size:11px;padding:5px 10px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">HIDE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ introClosed }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ showIntro }}\" style=\"font:inherit;font-size:11px;width:100%;text-align:left;padding:3px 12px;border:0;background:#C4EDEE;color:#111;cursor:pointer;letter-spacing:0.04em\" style-hover=\"background:#111;color:#EFEAE0\">▸ SHOW INSTRUCTIONS<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- C. PLANE STRIP -->\n  <div style=\"border-bottom:1px solid #111;display:grid;grid-template-rows:24px minmax(0,1fr);min-width:0\">\n    <div style=\"display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid #cfc8b9;min-width:0\">\n      <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;font-weight:700\">PLANES {{ planeCount }}<\u002Fspan>\n      <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;color:#555\">{{ selLabel }}<\u002Fspan>\n      <div style=\"margin-left:auto;display:flex;gap:4px;align-items:center;min-width:0;overflow-x:auto\">\n        <sc-for list=\"{{ groupChips }}\" as=\"g\" hint-placeholder-count=\"0\"><span style=\"display:flex;align-items:center;border:1px solid #111;background:{{ g.bg }}\"><button sc-camel-on-click=\"{{ g.pick }}\" title=\"Edit this group\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;padding:2px 6px;border:0;border-left:6px solid {{ g.color }};background:transparent;color:#111;cursor:pointer;white-space:nowrap\">{{ g.label }}<\u002Fbutton><button sc-camel-on-click=\"{{ g.del }}\" title=\"Delete group\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;padding:2px 5px;border:0;background:transparent;cursor:pointer\">×<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n        <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;margin-left:6px\">GROUP:<\u002Fspan>\n        <sc-for list=\"{{ groupBtns }}\" as=\"g\" hint-placeholder-count=\"7\"><button sc-camel-on-click=\"{{ g.run }}\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;padding:2px 6px;border:1px solid #111;background:transparent;color:#111;cursor:pointer;white-space:nowrap\" style-hover=\"background:#111;color:#EFEAE0\">{{ g.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;align-items:stretch\">\n      <sc-if value=\"{{ noPlanes }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;align-items:center;font-size:12px;color:#555\">No planes yet. 01 INGEST a source (or LOAD DEMO), then 02 EXTRACT.<\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ strip }}\" as=\"p\" hint-placeholder-count=\"0\">\n        <div draggable=\"true\" sc-camel-on-click=\"{{ p.onClick }}\" sc-camel-on-context-menu=\"{{ p.onContext }}\" sc-camel-on-drag-start=\"{{ p.onDragStart }}\" sc-camel-on-drag-over=\"{{ p.onDragOver }}\" sc-camel-on-drop=\"{{ p.onDrop }}\" title=\"{{ p.title }}\" style=\"position:relative;flex:none;height:100%;border:2px solid {{ p.border }};background:#000;cursor:pointer;display:flex\">\n          <div style=\"height:100%;aspect-ratio:{{ p.ar }};background-color:#000;background-position:center;background-size:cover;background-repeat:no-repeat;background-image:{{ p.bgImg }};opacity:{{ p.imgOp }}\"><\u002Fdiv>\n          <span style=\"position:absolute;left:0;top:0;background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:10px;font-weight:700;padding:1px 4px\">{{ p.num }}<\u002Fspan>\n          <span style=\"position:absolute;left:0;bottom:0;background:rgba(0,0,0,0.75);color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:9px;padding:1px 3px\">{{ p.time }}<\u002Fspan>\n          <span title=\"audio band\" style=\"position:absolute;right:0;bottom:0;background:#45D7D9;color:#111;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:9px;padding:1px 3px\">{{ p.band }}<\u002Fspan>\n          <span title=\"{{ p.gname }}\" style=\"position:absolute;left:0;top:15px;width:5px;height:18px;background:{{ p.gcol }}\"><\u002Fspan>\n          <sc-if value=\"{{ p.ovr }}\"><span title=\"overrides its group\" style=\"position:absolute;left:8px;top:18px;width:7px;height:7px;border-radius:50%;background:#D9D445;border:1px solid #111\"><\u002Fspan><\u002Fsc-if>\n          <div style=\"position:absolute;right:0;top:0;display:flex\">\n            <button sc-camel-on-click=\"{{ p.toggleMute }}\" title=\"Mute\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:9px;padding:1px 4px;border:0;background:{{ p.muteBg }};color:{{ p.muteFg }};cursor:pointer\">M<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ p.toggleSolo }}\" title=\"Solo\" style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:9px;padding:1px 4px;border:0;background:{{ p.soloBg }};color:{{ p.soloFg }};cursor:pointer\">S<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAIN: rail | viewport | inspector -->\n  <div style=\"display:grid;grid-template-columns:66px minmax(0,1fr) 360px;min-height:0\">\n\n    <!-- B. PIPELINE RAIL -->\n    <div style=\"border-right:1px solid #111;display:flex;flex-direction:column;overflow-y:auto;min-height:0\">\n      <sc-for list=\"{{ rail }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font:inherit;flex:none;border:0;border-bottom:1px solid #111;padding:7px 4px;background:{{ t.bg }};color:{{ t.fg }};cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px\">\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:14px;font-weight:700\">{{ t.num }}<\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:{{ t.dot }};border:1px solid {{ t.dotB }}\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-size:9px;letter-spacing:0.06em\">{{ t.label }}<\u002Fspan>\n          <span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:8px;padding:0 3px;background:{{ t.tagBg }};color: ">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(1040px,100%);background:#EFEAE0;border:2px solid #111\">\n      <div style=\"padding:12px 14px;border-bottom:2px solid #111;display:flex;align-items:center;gap:10px\"><span style=\"font-size:16px;font-weight:700\">How to use VOLUME<\u002Fspan><span style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px;color:#555\">time becomes depth<\u002Fspan>\n        <button sc-camel-on-click=\"{{ toggleGuide }}\" style=\"margin-left:auto;font:inherit;font-size:11px;padding:5px 10px;border:1px solid #111;background:#111;color:#EFEAE0;cursor:pointer\">CLOSE<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));border-left:1px solid #111\">\n        <sc-for list=\"{{ guideSteps }}\" as=\"g\" hint-placeholder-count=\"7\">\n          <div style=\"padding:14px;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"background:#111;color:#EFEAE0;font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:12px;font-weight:700;padding:2px 7px\">{{ g.n }}<\u002Fspan><span style=\"font-size:13px;font-weight:700;letter-spacing:0.04em\">{{ g.t }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.45;text-wrap:pretty\">{{ g.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:14px;font-size:13px;line-height:1.5;text-wrap:pretty\"><b style=\"font-family:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:11px\">MEDIA PREP<\u002Fb> MP4 (H.264) decodes most reliably. Use a locked-off shot for the difference key. Ten to twenty seconds of footage is plenty: 24–50 planes. Trim long clips with IN / OUT before you extract. Chrome or Edge on desktop is the reference browser.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002
